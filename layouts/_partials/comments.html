{{- if ne .Params.comments false -}}

{{- if .Site.Config.Services.Disqus.Shortname -}}
<hr style="margin-top: 40px; margin-bottom: 40px;" />
{{ partial "disqus.html" . }}
{{- end -}}

{{- with .Site.Params.comments.twikoo -}}
<hr style="margin-top: 40px; margin-bottom: 40px;" />
<div id="tcomment"></div>
<script src="https://registry.npmmirror.com/twikoo/2.0.17/files/dist/twikoo.min.js"
    integrity="sha384-EJPyhbbrkvGsDOBDGqqwgcYL6MJufQJbVC2yq58Qu77AeXzyZy8FQYde04X70ZDF"
    crossorigin="anonymous"
    defer></script>
<script>
    window.addEventListener('load', () => {
        twikoo.init({
            envId: '{{ .envId }}',
            el: '#tcomment',
            {{- with .region -}}
            region: '{{ . }}',
            {{- end -}}
            {{- with .path -}}
            path: '{{ . }}',
            {{- end -}}
            {{- with .lang -}}
            lang: '{{ . }}',
            {{- end -}}
        })
    })
</script>
{{- end -}}

{{- end -}}
