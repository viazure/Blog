name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    concurrency: deploy-cf-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout life-data
        id: life_data
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: viazure/life-data
          token: ${{ secrets.LIFE_DATA_READ_TOKEN }}
          path: life-data
          persist-credentials: false

      - name: Setup Python
        if: steps.life_data.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build data pages
        if: steps.life_data.outcome == 'success'
        run: |
          python scripts/build_lastfm.py
          python scripts/build_neodb.py
          python scripts/build_workouts.py

      - name: Commit data
        if: steps.life_data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/trails.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "update page data [skip ci]"
            git push
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Web
        run: hugo

      - name: Deploy Web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: cf-pages
          force_orphan: true
          keep_files: false
