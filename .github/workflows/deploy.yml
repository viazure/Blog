name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    concurrency: deploy-cf-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout life-data
        uses: actions/checkout@v5
        with:
          repository: viazure/life-data
          token: ${{ secrets.LIFE_DATA_READ_TOKEN }}
          path: life-data
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build data pages
        env:
          LTHR_BPM: ${{ vars.LTHR_BPM }}
        run: |
          python scripts/build_lastfm.py
          python scripts/build_neodb.py
          python scripts/build_workouts.py

      - name: Check data artifacts
        run: |
          set -euo pipefail
          for f in \
            data/lastfm.json \
            data/neodb.json \
            data/workouts.json \
            static/trails.json \
            static/data/workouts/index.json \
            static/data/media/lastfm/meta.json \
            static/data/media/neodb/meta.json
          do
            if [ ! -s "$f" ]; then
              echo "missing or empty: $f" >&2
              exit 1
            fi
          done

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Web
        run: hugo

      - name: Check published data pages
        run: |
          set -euo pipefail
          for f in \
            public/trails.json \
            public/data/workouts/index.json \
            public/data/media/lastfm/meta.json \
            public/data/media/neodb/meta.json \
            public/media/index.html \
            public/music/index.html \
            public/workouts/index.html
          do
            if [ ! -s "$f" ]; then
              echo "missing or empty after hugo: $f" >&2
              exit 1
            fi
          done

      - name: Deploy Web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: cf-pages
          force_orphan: true
          keep_files: false
